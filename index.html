<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" id="viewport-meta" content="width=1280, user-scalable=yes" />
    <script>
      (function () {
        // Otomatis lakukan Reload this page saat aplikasi pertama kali dibuka
        try {
          var now = Date.now();
          var lastReloadTs = parseInt(sessionStorage.getItem('interview_ai_auto_reload_ts') || '0', 10);
          if (!lastReloadTs || now - lastReloadTs > 5000) {
            sessionStorage.setItem('interview_ai_auto_reload_ts', String(now));
            sessionStorage.setItem('s01_setup_auto_reloaded', 'true');
            window.location.reload();
            return;
          }
        } catch (e) {}

        window.addEventListener('pageshow', function (event) {
          if (event.persisted) {
            window.location.reload();
          }
        });

        function applyNotebookViewport() {
          var vp = document.getElementById('viewport-meta');
          if (!vp) return;
          var targetWidth = 1280;
          var isLandscape = window.matchMedia && window.matchMedia('(orientation: landscape)').matches;
          var sw = window.screen.width || 0;
          var sh = window.screen.height || 0;
          var screenWidth = isLandscape ? Math.max(sw, sh) : Math.min(sw, sh);
          if (!screenWidth) screenWidth = window.outerWidth || window.innerWidth || targetWidth;
          if (window.outerWidth > 0 && window.outerWidth < screenWidth) {
            screenWidth = window.outerWidth;
          }
          if (screenWidth > 0 && screenWidth < targetWidth) {
            var scale = (screenWidth / targetWidth).toFixed(4);
            vp.setAttribute(
              'content',
              'width=' + targetWidth + ', initial-scale=' + scale + ', minimum-scale=' + scale + ', maximum-scale=3.0, user-scalable=yes'
            );
          } else {
            vp.setAttribute('content', 'width=' + targetWidth + ', initial-scale=1.0, user-scalable=yes');
          }
        }
        applyNotebookViewport();
        var vpResizeTimer = null;
        window.addEventListener('orientationchange', function () {
          setTimeout(applyNotebookViewport, 120);
        });
        window.addEventListener('resize', function () {
          clearTimeout(vpResizeTimer);
          vpResizeTimer = setTimeout(applyNotebookViewport, 150);
        });
        window.addEventListener('beforeprint', function () {
          var vp = document.getElementById('viewport-meta');
          if (vp) vp.setAttribute('content', 'width=device-width, initial-scale=1.0');
        });
        window.addEventListener('afterprint', function () {
          applyNotebookViewport();
        });
      })();
    </script>
    <title>InterviewAI - Simulasi Interview Kerja Realistis</title>
    <meta name="robots" content="noimageindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0b0f17] text-slate-100 antialiased selection:bg-cyan-500 selection:text-white font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
